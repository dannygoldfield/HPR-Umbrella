name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Test all components
        env:
          PYTHONPATH: components/audio-generator/src:components/video-generator/src:components/candidate-generator/src
        run: |
          python -m unittest discover -s components/audio-generator/tests -v
          python -m unittest discover -s components/video-generator/tests -v
          python -m unittest discover -s components/candidate-generator/tests -v
