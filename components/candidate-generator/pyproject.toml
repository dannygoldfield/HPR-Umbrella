[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "hpr-candidate-generator"
version = "0.1.0"
description = "Human-in-the-loop orchestration for How People Relate candidates"
requires-python = ">=3.11"

[project.scripts]
hpr-candidate = "hpr_candidate_generator.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "../audio-generator/src", "../video-generator/src"]
testpaths = ["tests"]
