[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "hpr-review"
version = "0.1.0"
description = "Small local human-review interface for HPR candidates"
requires-python = ">=3.11"

[project.scripts]
hpr-review = "hpr_review.server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
hpr_review = ["static/*.html"]
