[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "hpr-registry"
version = "0.1.0"
description = "SQLite operational registry for How People Relate production"
requires-python = ">=3.11"

[project.scripts]
hpr-registry = "hpr_registry.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
hpr_registry = ["schema.sql"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
